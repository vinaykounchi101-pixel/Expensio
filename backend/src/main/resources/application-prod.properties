# Production overrides — all sensitive values injected via env vars by Render.
# Never commit real credentials.

# ── DataSource (Supabase PostgreSQL) ─────────────────────────────────────────
# On Render, set env vars:  DB_URL  DB_USERNAME  DB_PASSWORD
# Inherited from application.properties:
#   spring.datasource.url=${DB_URL}
#   spring.datasource.username=${DB_USERNAME}
#   spring.datasource.password=${DB_PASSWORD}

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── CORS (set CORS_ALLOWED_ORIGINS to your Vercel domain in Render env vars) ─
# app.cors.allowed-origins inherited from application.properties via ${CORS_ALLOWED_ORIGINS}

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Swagger (disabled in prod) ───────────────────────────────────────────────
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.expensio=INFO
