services:
  db:
    image: postgres:16-alpine
    container_name: expensio-db
    environment:
      POSTGRES_DB: expensio
      POSTGRES_USER: expensio
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensio"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: expensio-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/expensio
      DB_USERNAME: expensio
      DB_PASSWORD: changeme
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:5173
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Defaults to local proxy/port when running inside docker-compose
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: expensio-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
